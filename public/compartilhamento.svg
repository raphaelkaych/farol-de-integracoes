<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Portfólio de Raphael Kaych</title>
  <desc id="desc">Software que passa pelo teste. Desenvolvimento, integrações e qualidade de software. Uma requisição atravessa interface, API e dados: a válida recebe 201 e a sem permissão recebe 403.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#071022"/><stop offset=".72" stop-color="#05070d"/></linearGradient>
    <radialGradient id="aura" cx=".82" cy=".05" r=".6"><stop stop-color="#377ffb" stop-opacity=".34"/><stop offset="1" stop-color="#377ffb" stop-opacity="0"/></radialGradient>
    <radialGradient id="benchGlow" cx=".5" cy=".55" r=".6"><stop stop-color="#12305a" stop-opacity=".6"/><stop offset="1" stop-color="#12305a" stop-opacity="0"/></radialGradient>
    <linearGradient id="node" x2="0" y2="1"><stop stop-color="#132a4a"/><stop offset="1" stop-color="#08101f"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#aura)"/>

  <g font-family="Geist, Segoe UI, -apple-system, Helvetica Neue, Arial, sans-serif">
    <path d="M80 112h40" stroke="#377ffb" stroke-width="4" stroke-linecap="round"/>
    <text x="136" y="120" fill="#a9bad2" font-size="24" font-weight="500">Desenvolvimento, integrações e qualidade de software</text>
    <text x="74" y="222" fill="#f1f6ff" font-size="92" font-weight="700" letter-spacing="-3.5">Software que</text>
    <text x="74" y="318" fill="#f1f6ff" font-size="92" font-weight="700" letter-spacing="-3.5">passa pelo teste.</text>
    <text x="80" y="548" fill="#f1f6ff" font-size="30" font-weight="650" letter-spacing="-.6">Raphael Kaych</text>
    <text x="80" y="584" fill="#a9bad2" font-size="21">Laboratórios com demo, código e testes abertos</text>
  </g>

  <g transform="translate(674 360)">
    <rect width="452" height="220" rx="22" fill="#060b17" stroke="#2b4469"/>
    <rect width="452" height="220" rx="22" fill="url(#benchGlow)"/>
    <g fill="none" stroke="#2b4469" stroke-width="1.6">
      <path d="M126 96h34M276 96h34"/>
      <path d="M368 138v26q0 12-12 12H96q-12 0-12-12v-26" stroke-dasharray="4 7"/>
    </g>
    <path d="M126 96h34" stroke="#8bbcff" stroke-width="2.2"/>
    <circle cx="148" cy="96" r="4" fill="#d2e7ff"/>
    <g font-family="Geist, Segoe UI, -apple-system, Helvetica Neue, Arial, sans-serif" text-anchor="middle" font-size="14" font-weight="600" fill="#e2eeff">
      <g transform="translate(34 56)">
        <rect width="92" height="82" rx="13" fill="url(#node)" stroke="#8abaff" stroke-width="1.6"/>
        <g fill="none" stroke="#8bbcff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" transform="translate(32 15)"><rect width="28" height="22" rx="4"/><path d="M0 6h28M7 11l4 3-4 3M15 18h6"/></g>
        <text x="46" y="62">Interface</text>
      </g>
      <g transform="translate(160 56)">
        <rect width="116" height="82" rx="13" fill="url(#node)" stroke="#ffb481" stroke-width="1.6"/>
        <g fill="none" stroke="#8bbcff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" transform="translate(44 14)"><path d="M8 2 0 12l8 10M20 2l8 10-8 10M17-1l-6 26"/></g>
        <text x="58" y="62">API</text>
      </g>
      <g transform="translate(310 56)">
        <rect width="92" height="82" rx="13" fill="url(#node)" stroke="#2b4469" stroke-width="1.6"/>
        <g fill="none" stroke="#8bbcff" stroke-width="1.7" stroke-linecap="round" transform="translate(32 13)"><ellipse cx="14" cy="3" rx="13" ry="4.5"/><path d="M1 3v18c0 6 26 6 26 0V3M1 12c0 6 26 6 26 0"/></g>
        <text x="46" y="62">Dados</text>
      </g>
    </g>
    <g font-family="JetBrains Mono, Consolas, Menlo, monospace" font-weight="700" font-size="15" text-anchor="middle">
      <rect x="34" y="16" width="58" height="28" rx="14" fill="#82dcb91f" stroke="#82dcb9" stroke-opacity=".6"/>
      <text x="63" y="35" fill="#82dcb9">201</text>
      <rect x="102" y="16" width="58" height="28" rx="14" fill="#ffb4811f" stroke="#ffb481" stroke-opacity=".6"/>
      <text x="131" y="35" fill="#ffb481">403</text>
    </g>
    <text x="226" y="202" fill="#8aa2c2" font-family="Geist, Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle">requisição e retorno</text>
  </g>
</svg>
